services:
  postgres:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:?missing EVOLUTION_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_URL: http://evolution.localhost:${HTTP_PORT:-8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?missing EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?missing EVOLUTION_DB_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_LOCAL_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      # The image's /evolution/.env turns these on; override explicitly.
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      TELEMETRY_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    # Evolution console.logs raw messages regardless of LOG_LEVEL; cap and rotate.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks: [backend]

  nginx:
    image: nginx:1.30.7-alpine
    restart: unless-stopped
    depends_on: [evolution-api]
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [backend]

networks:
  backend:

volumes:
  postgres_data:
  redis_data:
  evolution_instances:

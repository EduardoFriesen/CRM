worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_max_body_size 50m;

  # ponytail: under rootless Docker every client appears as the bridge gateway
  # (172.18.0.1), so these zones are effectively global, not per-client.
  # Real per-IP limiting needs rootful Docker or a front proxy passing the real IP.
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=web:10m rate=50r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream evolution { server evolution-api:8080; }

  # Unknown Host: drop the connection.
  server {
    listen 80 default_server;
    return 444;
  }

  server {
    listen 80;
    server_name evolution.localhost;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://evolution;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

}
